[project]
name = "peptalk-backend"
version = "0.1.0"
description = "PepTalk ingestion pipeline and search API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "faster-whisper>=1.1.0",
    "scenedetect[opencv]>=0.6.5",
    "librosa>=0.10.0",
    "sentence-transformers>=3.3.0",
    "anthropic>=0.40.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "pysrt>=1.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
